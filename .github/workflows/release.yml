name: Build Windows Release

on:
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          printf 'VERSION = "%s"\n' "$VERSION" > api/__init__.py
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Vue frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Convert icon PNG to ICO
        run: python -c "from PIL import Image; img = Image.open('icon.png'); img.save('icon.ico', format='ICO', sizes=[(256,256),(64,64),(32,32),(16,16)])"

      - name: Generate Windows version info
        run: python build_version_info.py ${{ env.APP_VERSION }}

      - name: Build Windows executable
        run: |
          pyinstaller --onefile --name "FarmDash-${{ env.APP_VERSION }}" --noconsole `
            --icon icon.ico `
            --version-file version_info.txt `
            --add-data "icon.png;." `
            --add-data "api\static;api\static" `
            --collect-all uvicorn `
            --collect-all starlette `
            --collect-all pystray `
            --hidden-import fastapi `
            --hidden-import anyio `
            --hidden-import anyio._backends._asyncio `
            --hidden-import pystray._win32 `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            --collect-all tkinter `
            --hidden-import tkinter `
            --hidden-import tkinter.filedialog `
            main.py

      - name: Upload FarmDash.exe to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FarmDash-${{ env.APP_VERSION }}.exe
